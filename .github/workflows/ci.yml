name: CI

on:
  push:
    branches: [main, rust-rewrite]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  kit-check:
    uses: hangar-ai/.github/.github/workflows/kit-check.yml@rust-rewrite

  # The tab is native: its tests, and the committed module checked against the
  # source. Hangar runs tabs/annotate.wasm as it is committed, so a module
  # older than native/ would ship old behaviour.
  native:
    name: Native tab (cargo test, module up to date)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The Rust rust-toolchain.toml pins, with its wasm32 target
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown --component clippy
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'native/Cargo.lock') }}
      - name: Tests
        run: cargo test --manifest-path native/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - name: The committed module is the one the source builds
        run: scripts/build-native.sh --check
